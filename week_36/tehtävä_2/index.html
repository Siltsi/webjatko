<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChuckJokes</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <header>
            <h1>ChuckJokes</h1>
        </header>

        <section class="joke-card">
            <div class="joke-content">
                <p id="joke" class="joke-text">
                    Loading joke...
                </p>

                <button id="joke-button" type="button">
                    Next joke
                </button>

                <p id="status" class="status" aria-live="polite"></p>
            </div>

            <img id="chuck-image" alt="Chuck Norris" class="joke-image">
        </section>
    </main>
</body>

</html>
